<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BF6 Attachment Database</title>
<meta name="description" content="Battlefield 6 attachment database and build menu: every attachment's cost, tags and stat changes, read straight from the game, with a live build simulator.">
<meta name="theme-color" content="#0b0d10">
<meta property="og:title" content="BF6 Attachment Database">
<meta property="og:description" content="Every Battlefield 6 attachment's cost, tags and stat changes, read from the game, with a live build menu.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0d10'/%3E%3Cpath d='M6 22l10-12 10 12' fill='none' stroke='%23a683d5' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d10; --bg2:#111419; --panel:#161a20; --row:#1a1f26; --rowh:#212731; --line:#262c35;
  --ink:#e6e9ee; --muted:#8a93a0; --dim:#5f6873; --accent:var(--acc-d,#ff7a1a); --accent2:var(--acc2-d,#ffb27a);
  --good:#4fd18b; --bad:#ff6b6b; --cap:#7ab8ff; --lock:#c9a2ff; --warn:#f2b134;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#d6dae1; --bg2:#c3c9d2; --panel:#e6e9ee; --row:#eef0f4; --rowh:#f7f8fa; --line:#adb5c1;
    --ink:#0f1318; --muted:#434c58; --dim:#636c78; --accent:var(--acc-l,#d95f00); --accent2:var(--acc2-l,#a64800);
    --good:#13784a; --bad:#c62828; --cap:#1f5fbf; --lock:#6b3fb5; --warn:#8f6400;
  }
}
:root[data-theme="light"]{
  --bg:#d6dae1; --bg2:#c3c9d2; --panel:#e6e9ee; --row:#eef0f4; --rowh:#f7f8fa; --line:#adb5c1;
  --ink:#0f1318; --muted:#434c58; --dim:#636c78; --accent:var(--acc-l,#d95f00); --accent2:var(--acc2-l,#a64800);
  --good:#13784a; --bad:#c62828; --cap:#1f5fbf; --lock:#6b3fb5; --warn:#8f6400;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Barlow,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;height:56px;padding:0 16px;background:var(--bg2);border-bottom:1px solid var(--line)}
.logo{font:700 20px "Barlow Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.logo i{font-style:normal;color:var(--accent)}
.navbtn.on{color:var(--ink);border-color:var(--muted)}
.sbox{position:relative;flex:1;max-width:560px}
.sbox input{width:100%;height:36px;padding:0 60px 0 34px;background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--ink);font:14px Barlow,sans-serif}
.sbox input:focus{outline:none;border-color:var(--accent)}
.sbox svg{position:absolute;left:11px;top:11px;opacity:.6}
.sbox kbd{position:absolute;right:9px;top:8px;font:11px "JetBrains Mono",monospace;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.results{position:absolute;top:42px;left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 14px 40px rgba(0,0,0,.4);overflow:hidden;max-height:70vh;overflow-y:auto}
.results a{display:grid;grid-template-columns:84px 1fr;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line)}
.results a.on,.results a:hover{background:var(--rowh)}
.results em{font:600 10px "JetBrains Mono",monospace;text-transform:uppercase;color:var(--accent);font-style:normal;padding-top:3px}
.results span{display:block;color:var(--muted);font-size:12px}
.results mark{background:none;color:var(--accent2);font-weight:600}
.patch{margin-left:auto;font:12px "JetBrains Mono",monospace;color:var(--dim);white-space:nowrap}
.seasons{margin-left:auto}.patch:not([hidden])+.seasons{margin-left:0}
.tb{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:5px 9px;cursor:pointer}
.kofi{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:6px;text-decoration:none;white-space:nowrap;font:600 13px Barlow,sans-serif;color:var(--bg);background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 2px 10px color-mix(in srgb,var(--accent) 30%,transparent);transition:filter .15s,transform .15s}
.kofi{margin-left:auto} .patch:not([hidden])+.kofi{margin-left:0} .kofi+.seasons{margin-left:0!important}
.kofi:hover{filter:brightness(1.1);transform:translateY(-1px)}
@media (max-width:1100px){ .kofi span{display:none} .kofi{padding:6px 8px} }
body.phonemode .kofi span{display:none} body.phonemode .kofi{padding:6px 8px}
.tb:hover{color:var(--ink);border-color:var(--muted)}
.shell{--navw:220px;--detw:400px;display:grid;grid-template-columns:var(--navw) minmax(0,1fr) var(--detw);height:calc(100vh - 56px);transition:grid-template-columns .15s}
body.nonav .shell{--navw:0px}
body.nonav nav{display:none}
.shell>nav{grid-column:1}.shell>.list{grid-column:2}.shell>.detail{grid-column:3}
body.float .shell{--detw:0px}
body.float .detail{position:fixed;top:56px;right:0;bottom:0;width:min(440px,100%);z-index:15;transform:translateX(105%);transition:transform .2s;visibility:hidden;border-left:1px solid var(--line)}
body.float .detail.open{transform:none;visibility:visible;box-shadow:-20px 0 40px rgba(0,0,0,.35)}
.dtools{position:sticky;top:-20px;margin:-20px -20px 12px;padding:10px 12px;display:flex;gap:6px;justify-content:flex-end;background:var(--panel);border-bottom:1px solid var(--line);z-index:2}
.items{display:block}
body.cols2 .items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-items:start}
body.cols2 .items>.row,body.cols2 .items>.wcard{margin-bottom:0}
body.cols2 .items>.row:not(.wrow){grid-template-columns:42px minmax(0,1fr) 52px}
body.cols2 .items>.row:not(.wrow) .tags{grid-column:2/4;grid-row:2;justify-content:flex-start;max-width:none}
body.cols2 .items>.row:not(.wrow) .pts{grid-column:3;grid-row:1}
body.cols2 .items>.wrow{grid-template-columns:42px minmax(0,1fr)}
body.cols2 .items>.wrow .mbars{grid-column:2;grid-row:2;grid-template-columns:repeat(4,minmax(0,1fr))}
.wcard{container-type:inline-size}

nav{border-right:1px solid var(--line);overflow:auto;padding:14px 10px;background:var(--bg2)}
nav h6{font:600 11px "Barlow Condensed",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:16px 8px 6px}
nav h6:first-child{margin-top:4px}
nav a,nav span{display:flex;justify-content:space-between;padding:6px 10px;border-radius:5px;color:var(--muted);font-weight:500}
nav a:hover{background:var(--row);color:var(--ink)}
nav a.on{background:var(--row);color:var(--ink);box-shadow:inset 2px 0 0 var(--accent)}
nav b{font:12px "JetBrains Mono",monospace;color:var(--dim);font-weight:400}
nav span{opacity:.5}
.list{overflow:auto;padding:20px 22px 60px}
.eyebrow{font:600 11px "Barlow Condensed",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
h1{font:700 34px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.02em;margin:4px 0 6px}
.sub{color:var(--muted);margin:0 0 12px;max-width:70ch}
.slotnote{border:1px solid var(--line);border-left:3px solid var(--warn);background:var(--panel);border-radius:0 6px 6px 0;padding:8px 12px;margin:0 0 14px;color:var(--muted);font-size:13px;max-width:80ch}
.ctrls{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:5px 10px;border-radius:5px;cursor:pointer;font:600 12px "Barlow Condensed",sans-serif;letter-spacing:.08em;text-transform:uppercase}
.chip b{font:11px "JetBrains Mono",monospace;color:var(--dim);margin-left:4px;font-weight:400}
.chip.on{border-color:var(--accent);color:var(--ink);background:var(--row)}
.chip:hover{color:var(--ink)}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.count{font:12px "JetBrains Mono",monospace;color:var(--dim);margin:6px 0 8px}
.grouphead{font:600 12px "Barlow Condensed",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px;display:flex;gap:8px;align-items:center}
.grouphead b{font:11px "JetBrains Mono",monospace;color:var(--dim);font-weight:400}
.row{display:grid;grid-template-columns:42px minmax(0,1fr) auto 52px;gap:12px;align-items:center;background:var(--row);border:1px solid var(--line);border-radius:6px;padding:9px 12px;margin-bottom:6px;cursor:pointer}
.row:hover{background:var(--rowh)}
.row.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.ico{width:42px;height:30px;border:1px solid var(--line);border-radius:4px;display:grid;place-items:center;font:600 10px "JetBrains Mono",monospace;color:var(--accent2);background:var(--bg2)}
.nm{font-weight:600;font-size:15px;min-width:0}
.nm small{display:block;font-weight:400;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al{font:11px "JetBrains Mono",monospace;color:var(--accent2);border:1px solid var(--line);border-radius:3px;padding:0 4px;margin-left:6px;vertical-align:1px;font-weight:400}
.kind{font:10px "JetBrains Mono",monospace;text-transform:uppercase;color:var(--warn);margin-left:6px;font-weight:400;vertical-align:1px}
.tags{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;max-width:340px}
.items>.row:not(.wrow) .tags{flex-wrap:nowrap;max-width:none;gap:3px}
.items>.row:not(.wrow) .t{padding:1px 5px;font-size:11px}
.items>.row:not(.wrow) .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail .row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.stack{grid-template-columns:42px minmax(0,1fr) 40px;row-gap:5px}
.row.stack .tags{grid-column:2/4;grid-row:2;justify-content:flex-start;max-width:none;flex-wrap:wrap}
.row.stack .pts{grid-column:3;grid-row:1}
.t{font:500 11.5px "JetBrains Mono",monospace;padding:1px 6px;border-radius:3px;background:var(--bg2);border:1px solid var(--line);color:var(--cap);white-space:nowrap}
.t.up{color:var(--good)} .t.down{color:var(--bad)} .t.lock{color:var(--lock)} .t.prop{color:var(--warn)}
a.t:hover{border-color:currentColor}
.pts{font:600 18px "Barlow Condensed",sans-serif;text-align:right;color:var(--ink);white-space:nowrap}
.pts small{display:block;font:10px "JetBrains Mono",monospace;color:var(--dim)}
.empty{color:var(--dim);border:1px dashed var(--line);border-radius:8px;padding:28px;text-align:center;margin-top:24px}
.detail{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:20px 20px 60px}
.detail h2{font:700 26px/1.05 "Barlow Condensed",sans-serif;text-transform:uppercase;margin:4px 0 12px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:6px}
.kv div{background:var(--row);padding:8px 10px;min-width:0}
.kv label{display:block;font:600 10px "Barlow Condensed",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.kv b{font:600 16px "Barlow Condensed",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.sec{margin:20px 0 8px;display:flex;justify-content:space-between;align-items:center;font:600 12px "Barlow Condensed",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.src{font:500 10px "JetBrains Mono",monospace;letter-spacing:0;text-transform:none;padding:1px 6px;border-radius:3px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.src.old{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.src.u{border-style:dashed;color:var(--bad)}
.src.game{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.fx{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:start}
.fx .d{color:var(--muted);font-size:13px}
.fx .d b{color:var(--ink)}
.fx a.d:hover b{color:var(--accent2)}
.none{color:var(--dim);font-size:13px}
.names{display:flex;flex-wrap:wrap;gap:6px}
.names span{background:var(--row);border:1px solid var(--line);border-radius:4px;padding:3px 8px;font-size:13px}
.facts{display:grid;grid-template-columns:110px 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.facts div{background:var(--row);padding:7px 10px;font-size:13px}
.facts div:nth-child(odd){color:var(--dim);font:600 11px "Barlow Condensed",sans-serif;letter-spacing:.1em;text-transform:uppercase;padding-top:9px}
.ph{border:1px dashed var(--line);border-radius:6px;padding:10px 12px;font-size:12.5px;color:var(--muted)}
.ph b{color:var(--bad);font-weight:600}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.st{background:var(--row);border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer;min-width:0}
.st:hover{background:var(--rowh)} .st.on{border-color:var(--accent)}
.st b{font-weight:600} .st code{float:right;font:11px "JetBrains Mono",monospace;color:var(--accent2)}
.st span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.st .bar{display:flex;gap:12px;margin-top:6px;font:11px "JetBrains Mono",monospace}
.st{position:relative;padding-bottom:30px} .st .bar{position:absolute;left:12px;right:12px;bottom:9px;margin:0;justify-content:space-between}
.st .bar .cost{color:var(--accent)} .rng{margin:6px 0 4px} .rtrack{position:relative;height:10px;border-radius:5px;background:var(--bg2);border:1px solid var(--line)}
.rtrack i{position:absolute;top:-1px;bottom:-1px;border-radius:5px;background:var(--accent)}
.rlab{position:relative;display:flex;justify-content:space-between;font:11px "JetBrains Mono",monospace;color:var(--dim);margin-top:4px;height:16px}
.rlab b{position:absolute;transform:translateX(-50%);color:var(--ink);font-weight:600}
.st .bar .cnt{color:var(--muted);margin-left:auto}
.detail h2.wc{display:flex;justify-content:space-between;align-items:baseline;gap:12px} .detail h2 .hcost{color:var(--accent);white-space:nowrap;text-transform:none}
.st .bar i{font-style:normal}
.prose{max-width:72ch;color:var(--muted)}
.prose b{color:var(--ink)}
.legend{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:center;max-width:640px;margin:8px 0 16px}
.pill{font:600 10px "JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.04em;padding:2px 6px;border-radius:3px;border:1px solid currentColor;float:right;margin-left:6px}
.st .pill{float:none;display:inline-block;margin:0 0 0 6px;vertical-align:1px}
.inp{background:var(--row);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:6px;font-size:13px;color:var(--muted)}
.inp>code{font:600 12.5px "JetBrains Mono",monospace;color:var(--accent2);word-break:break-all}
.inp>div{margin-top:2px;color:var(--ink)}
.inp small{display:block;margin-top:3px;color:var(--dim);font-size:12px}
.inp small code{font:11.5px "JetBrains Mono",monospace;color:var(--cap);word-break:break-word}
.detail h2 .pill{float:none;vertical-align:6px;font-size:10px}
.pill.ok{color:var(--good)} .pill.part{color:var(--warn)} .pill.mid{color:var(--cap)}
.st .mk{color:var(--accent2);font-style:normal}
.ladder{display:flex;gap:3px}
.rung{flex:1;min-width:0;background:var(--row);border:1px solid var(--line);border-radius:4px;padding:6px 2px;text-align:center}
.rung b{display:block;font:600 14px "Barlow Condensed",sans-serif}
.rung span{display:block;font:10px "JetBrains Mono",monospace;color:var(--dim)}
.ladcap{display:flex;justify-content:space-between;gap:8px;font:11px "JetBrains Mono",monospace;color:var(--dim);margin-top:5px}
.cap{color:var(--muted);font-size:13px;margin:0 0 6px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin:4px 0}
.tbl th{text-align:left;font:600 10px "Barlow Condensed",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:5px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl code,.facts code{font:12px "JetBrains Mono",monospace;color:var(--accent2);word-break:break-word}
.tbl code.sym{color:var(--cap)}
ul.notes{margin:0;padding-left:18px;color:var(--muted);font-size:13px}
ul.notes li{margin:0 0 6px}
ul.notes.open{list-style:none;padding:0}
ul.notes.open li{border-left:3px solid var(--warn);background:var(--row);padding:8px 10px;border-radius:0 5px 5px 0}
.formula{font:13px/1.6 "JetBrains Mono",monospace;background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:10px 12px;color:var(--ink);overflow-x:auto;white-space:pre-wrap}
.barlink{background:var(--row);border:1px solid var(--line);border-radius:4px;padding:4px 10px;font-weight:600}
.barlink:hover{border-color:var(--accent)}
.mbars{display:grid;grid-template-columns:repeat(4,64px);gap:8px}
.mb span{display:block;font:600 9.5px "Barlow Condensed",sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.mb i{display:block;height:4px;background:var(--bg2);border-radius:2px;overflow:hidden;margin:2px 0}
.mb u{display:block;height:100%;background:var(--muted);border-radius:2px}
.mb.hot u{background:var(--accent)}
.mb b{font:600 13px "JetBrains Mono",monospace}
.wrow{grid-template-columns:42px minmax(0,1fr) auto}
.bms{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bm{background:var(--row);border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:block}
.bm:hover{border-color:var(--accent)}
.bmh{display:flex;justify-content:space-between;align-items:center;line-height:1}
.bmh span{font:600 11px "Barlow Condensed",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.bmh b{font:700 22px "Barlow Condensed",sans-serif}
.bm i{position:relative;display:block;height:6px;background:var(--bg2);border-radius:3px;margin:4px 0}
.bm u{display:block;height:100%;background:var(--accent);border-radius:3px}
.bm em{position:absolute;top:-3px;width:2px;height:12px;background:var(--ink);margin-left:-1px}
.bm small{display:block;font:11px "JetBrains Mono",monospace;color:var(--dim)}
.kvl{border:1px solid var(--line);border-radius:6px;overflow:hidden}
.kvl div{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;border-bottom:1px solid var(--line);font-size:13px;background:var(--row)}
.kvl div:last-child{border-bottom:0}
.kvl span{color:var(--muted)}
.kvl span code{display:block;font:10.5px "JetBrains Mono",monospace;color:var(--dim)}
.kvl b{font:500 13px "JetBrains Mono",monospace;text-align:right}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;touch-action:none}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--dim);font:10px "JetBrains Mono",monospace}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.chart .xh{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.chart .dot{fill:var(--accent);stroke:var(--panel);stroke-width:2}
.chart .tip{position:absolute;top:0;background:var(--bg2);border:1px solid var(--line);border-radius:4px;padding:2px 8px;font:11px "JetBrains Mono",monospace;pointer-events:none;white-space:nowrap}
details.symraw{margin-top:16px}
details.symraw summary{cursor:pointer;font:600 12px "Barlow Condensed",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
ul.notes code{font:12px "JetBrains Mono",monospace;color:var(--accent2)}
.wcard{background:var(--row);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.wcard:hover{border-color:var(--muted)}
.wcard.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.wh{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center}
.wh .open{font:600 11px "Barlow Condensed",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.wcard:hover .open{color:var(--accent)}

e": "EF88 only", "desc": "Weapon restriction.", "applies": {"weapons": ["EF88"]}}, "INTEGRAL-SUPP": {"group": "restrict", "name": "Integrally suppressed", "desc": "Integrally suppressed weapons, which have no muzzle slot.", "applies": null}, "FEW-WEAPONS": {"group": "restrict", "name": "Select weapons", "desc": "Offered on a handful of weapons only.", "applies": null}}, "mech": {"_about": "How stats work. 'tag_details' adds ladders, tiers and notes to tags in stats.json. 'bars' are the four in-game stat bars. 'fields' maps the data fields the bar formulas use to their sym.gg names. Every block carries a source. Nothing here is inferred: open questions are listed as open.", "tag_details": {"ADS": {"source": "v0.9.3", "ladder": {"unit": "ms", "label": "ADS time", "rungs": [[500, 30], [433, 26], [367, 22], [300, 18], [250, 15], [200, 12], [167, 10], [133, 8], [100, 6]], "steps": "Frame steps 4 · 4 · 4 · 3 · 3 · 2 · 2 · 2"}, "notes": ["Each buff or debuff moves the weapon exactly one rung.", "The step size shrinks toward the fast end, so diminishing returns are built into the ladder."], "fields": [{"field": "ads_time_in_ms", "source": "ingame.json", "note": "All 59 measured weapons sit on this ladder: 133, 167, 200, 250, 300, 367 and 433 ms occur."}]}, "DRAW": {"source": "v0.9.3", "ladder": {"unit": "ms", "label": "Draw time", "rungs": [[400, 24], [350, 21], [300, 18], [267, 16], [233, 14], [200, 12], [167, 10], [133, 8], [100, 6], [83, 5]], "steps": "Frame steps 3 · 3 · 2 · 2 · 2 · 2 · 2 · 2 · 1"}, "notes": ["A step is 17–50 ms depending on where the weapon sits on the ladder, not a flat amount.", "+DRAW2 means a two-rung gain.", "The last rung is a single frame, half the gain of every step below it, so 100 → 83 ms buys the least of any +DRAW."]}, "REC": {"source": "verified", "words": {"label": "Grip tooltips grade recoil reduction with a qualifier", "rows": [["Marginally reduces recoil", "+REC1"], ["Slightly reduces recoil", "+REC2"], ["Moderately reduces recoil", "+REC3"], ["Significantly reduces recoil", "+REC4"], ["Greatly reduces recoil", "+REC5"]]}, "bars": ["control", "precision"]}, "HIP": {"source": "v0.9.3", "words": {"label": "Laser and light tooltips grade hipfire improvement with a qualifier", "rows": [["Minor", "+HIP1"], ["Slight", "+HIP2"], ["Moderate", "+HIP3"]], "source": "verified"}}, "mACC": {"source": "v0.9.3", "tiers": {"label": "Rung values are not published, so this stat is mapped by tier. Each +mACC moves one tier better, each −mACC one tier worse.", "rows": [["−3", "Moving spread equals stationary spread. Modeled, but no known attachment route reaches it."], ["−2", "The practical ceiling: one barrel plus one laser."], ["−1", "One source, or one penalty cancelled."], ["0", "Base moving spread, 6.4× stationary."], ["+1", "A penalized grip. The worst case possible."]]}, "notes": ["Moving ADS spread starts at 0.32° against 0.05° stationary, a 6.4× penalty on every shot taken while strafing.", "Two tiers is the reachable maximum: one barrel and one laser. A second laser cannot be mounted and no other slot grants +mACC.", "−mACC exists in one slot only, the underbarrel, on 12 of its 21 grips. A weapon has one underbarrel, so +1 is the floor and a single +mACC source cancels it."], "fields": [{"field": "ADSStandMoveMin", "source": "sym.gg", "note": "0.32 on every weapon (checked 2026-10-06)."}, {"field": "ADSStandBaseMin", "source": "sym.gg", "note": "0.05 on every weapon except the bolt-action snipers, which are 0."}], "words": {"source": "verified", "label": "", "rows": [["Minor", "+mACC"]]}}, "mSPD": {"source": "v0.9.3", "tiers": {"label": "Mapped by tier. Each +mSPD moves one tier better, each −mSPD one tier worse, and the shifts sum.", "rows": [["−1 tier (better)", "Lightweight ammo · low-capacity magazines"], ["+1 tier (worse)", "+REC4 and +REC5 grips · high-capacity magazines · Multi and Thermal optics"]]}, "notes": ["Three separate slots can charge this stat at once (underbarrel, magazine, optic), and it const sync = () => { let h; try { h = location.hash || "#/"; } catch (e) { return; } if (h !== CUR){ CUR = h; $("#q").value = ""; $("#res").hidden = true; render(); } };
/* =================== quality-of-life =================== */
function saveList(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function loadList(k){ try { const v = JSON.parse(localStorage.getItem(k) || "[]"); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
var RECENT = loadList("recent"), STARS = loadList("stars");
const LF = {q: "", focus: false};
// label + kind for any detail route
function itemInfo(h){
  const [k, id] = h.replace(/^#\/?/, "").split("/").map(decodeURIComponent);
  if (k === "a" && famById[id]) return {label: famById[id].names[0], kind: slotById[famById[id].slot].name};
  if (k === "w" && wepById[id]) return {label: wepById[id].name, kind: cl(wepById[id].class)};
  if (k === "build" && wepById[id]) return {label: wepById[id].name + " build", kind: "Build"};
  if (k === "tag" && TAGS[id]) return {label: TAGS[id].name, kind: id};
  if (k === "bar" && BARS[id]) return {label: BARS[id].name + " bar", kind: "Bar"};
  return null;
}
function navItem(h, r){ const i = itemInfo(h); if (!i) return ""; return `<a href="${esc(h)}" class="${CUR === h ? "on" : ""}">${esc(i.label)} <b>${esc(i.kind)}</b></a>`; }
const isDetailRoute = h => !!itemInfo(h);
function LFBOX(){ return `<label class="lf"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="lf" placeholder="Filter" value="${esc(LF.q)}" autocomplete="off" aria-label="Filter this list">${LF.q ? `<button type="button" id="lfx" title="Clear filter">✕</button>` : ""}</label>`; }
function listKind(){ const r = route()[0]; return ["weapons","wclass","w"].includes(r) ? "w" : ["tags","tag","bar","about","build","open"].includes(r) ? null : "a"; }

function fitRows(){
  const L = $("#list"); if (!L) return; L.classList.remove("stackrows");
  if (document.body.classList.contains("cols2")) return;
  if ([...L.querySelectorAll(".items>.row:not(.wrow) .nm")].some(n => n.scrollWidth > n.clientWidth + 1)) L.classList.add("stackrows");
}
addEventListener("resize", () => fitRows());
/* card charts take exactly the height of the four bars, beside them or stacked under them */
function fitCharts(){
  document.querySelectorAll(".wchart[data-fit]").forEach(wc => {
    const w = wepById[wc.dataset.fit], s = w?.sym; if (!s) return;
    const bms = wc.closest(".wb").querySelector(".bms"), inner = wc.clientWidth - 12;
    const H = inner > 0 ? Math.max(60, Math.round(360 * (bms.offsetHeight - 8) / inner)) : 128;
    if (wc.dataset.h == H) return; wc.dataset.h = H;
    wc.innerHTML = dmgChart(s["damage.dmgs"], s["damage.dists"], s.pellets, {...CLASS_SCALE[w.class], H, caption: false}); wireChart(wc.querySelector(".chart"));
  });
}
addEventListener("resize", () => fitCharts());
function postRender(){
  fitRows(); fitCharts();
  // recent
  if (isDetailRoute(CUR)){ const key = CUR.replace(/^(#\/build\/[^/]+)\/.*$/, "$1"); RECENT = [key, ...RECENT.filter(x => x !== key)].slice(0, 8); saveList("recent", RECENT); }
  // stars on rows
  document.querySelectorAll("#list [data-id],#list [data-w]").forEach(el => {
    const h = el.dataset.id ? "#/a/" + el.dataset.id : "#/w/" + el.dataset.w;
    if (STARS.includes(h)){ const nm = el.querySelector(".nm"); if (nm && !nm.querySelector(".star")) nm.insertAdjacentHTML("afterbegin", `<span class="star" title="Starred">★</span>`); }
  });
  // filter box wiring
  const lf = $("#lf");
  if (lf){
    lf.oninput = () => { LF.q = lf.value; LF.focus = true; render(); };
    lf.onkeydown = e => { if (e.key === "Escape"){ LF.q = ""; LF.focus = false; render(); } else if (e.key === "ArrowDown"){ lf.blur(); LF.focus = false; moveSel(1); e.preventDefault(); } };
    const x = $("#lfx"); if (x) x.onclick = () => { LF.q = ""; LF.focus = false; render(); };
    if (LF.focus){ lf.focus(); lf.setSelectionRange(lf.value.length, lf.value.length); }
  }
  // back to top
  const L = $("#list");
  if (!$("#totop")){ L.insertAdjacentHTML("beforeend", `<button id="totop" class="totop" title="Back to top (T)" aria-label="Back to top">↑</button>`); }
  else L.appendChild($("#totop"));
  $("#totop").onclick = () => L.scrollTo({top: 0, behavior: "smooth"});
  $("#totop").classList.toggle("show", L.scrollTop > 500);
}
$("#list").addEventListener("scroll", () => { const t = $("#totop"); if (t) t.classList.toggle("show", $("#list").scrollTop > 500); }, {passive: true});
// list filter resets when you move to a different list
// the list filter clears when you switch between the attachment, weapon and reference sections
let _lastKind = null;
const _render = render;
render = function(){ const k = listKind() || "x"; if (_lastKind && k !== _lastKind){ LF.q = ""; LF.focus = false; } _lastKind = k; _render(); };

function toggleStar(){ const i = STARS.indexOf(CUR); if (i < 0) STARS.unshift(CUR); else STARS.splice(i, 1); saveList("stars", STARS); render(); toast(i < 0 ? "Added to Starred" : "Removed from Starred"); }
const SITE_URL = "https://antiphysicsgames.github.io/battlefield6-attachment-database/";
function shareUrl(){ let base; try { base = /^https?:/.test(location.protocol) ? location.origin + location.pathname : SITE_URL; } catch (e) { base = SITE_URL; } return base + CUR; }
async function copyLink(){
  const u = shareUrl(); let ok = false;
  try { await navigator.clipboard.writeText(u); ok = true; } catch (e) {
    try { const t = document.createElement("textarea"); t.value = u; t.style.position = "fixed"; t.style.opacity = "0"; document.body.appendChild(t); t.select(); ok = document.execCommand("copy"); t.remove(); } catch (e2) {} }
  toast(ok ? "Link copied" : "Copy failed: " + u);
}
function toast(msg){ let t = $("#toast"); if (!t){ document.body.insertAdjacentHTML("beforeend", `<div id="toast" class="toast" role="status"></div>`); t = $("#toast"); } t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1800); }

// arrow-key browsing
function listItems(){ return [...document.querySelectorAll("#list .items [data-id], #list .items [data-w], #list .st")]; }
function moveSel(d){
  const els = listItems(); if (!els.length) return;
  let i = els.findIndex(e => e.classList.contains("on")); i = i < 0 ? (d > 0 ? 0 : els.length - 1) : Math.max(0, Math.min(els.length - 1, i + d));
  els[i].click(); const el = listItems()[i]; if (el) el.scrollIntoView({block: "nearest"});
}
// shortcuts help
const KEYS = [["/  or  Ctrl K","Search everything"],["↑ ↓","Previous / next item in the list"],["Just type","Filter the current list"],["Esc","Close the panel, clear the filter"],["S","Star / unstar the open item"],["C","Copy a link to the open item"],["T","Back to top"],["?","Show this help"]];
function showHelp(){ if ($("#help")) { $("#help").remove(); return; }
  document.body.insertAdjacentHTML("beforeend", `<div id="help" class="help" role="dialog" aria-label="Keyboard shortcuts"><div class="hbox"><div class="hhead"><b>Keyboard shortcuts</b><button class="tb" onclick="$('#help').remove()">✕</button></div>${KEYS.map(([k, v]) => `<div class="hrow"><kbd>${esc(k)}</kbd><span>${esc(v)}</span></div>`).join("")}</div></div>`);
  $("#help").onclick = e => { if (e.target.id === "help") $("#help").remove(); };
}
document.addEventListener("keydown", e => {
  const tag = document.activeElement?.tagName || "";
  if (/input|textarea|select/i.test(tag) || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "Escape" && $("#help")){ $("#help").remove(); return; }
  if (e.key === "Escape" && LF.q && !$("#detail").classList.contains("open")){ LF.q = ""; render(); return; }
  if (e.key === "ArrowDown" || e.key === "ArrowUp"){ if (listItems().length){ e.preventDefault(); moveSel(e.key === "ArrowDown" ? 1 : -1); } return; }
  if (e.key === "?"){ e.preventDefault(); showHelp(); return; }
  const open = isDetailRoute(CUR) && $("#detail").classList.contains("open");
  if ((e.key === "s" || e.key === "S") && open){ e.preventDefault(); toggleStar(); return; }
  if ((e.key === "c" || e.key === "C") && open){ e.preventDefault(); copyLink(); return; }
  if ((e.key === "t" || e.key === "T")){ e.preventDefault(); $("#list").scrollTo({top: 0, behavior: "smooth"}); return; }
  // type-to-filter on list pages
  if (e.key.length === 1 && /\S/.test(e.key) && e.key !== "/" && $("#lf")){ e.preventDefault(); LF.q += e.key; LF.focus = true; render(); }
});

// hover previews
const HOVER = matchMedia("(hover:hover) and (pointer:fine)");
function previewHTML(h){
  const [k, id] = h.replace(/^#\/?/, "").split("/").map(decodeURIComponent);
  if (k === "a" && famById[id]){ const f = famById[id];
    return `<div class="pv-k">${esc(slotById[f.slot].name)} · ${esc(PTS(f.pts))} pts</div><b>${esc(f.names[0])}</b>${f.names.length > 1 ? `<div class="pv-s">Also: ${esc(f.names.slice(1).join(", "))}</div>` : ""}${f.description ? `<div class="pv-s">${esc(f.description)}</div>` : ""}<div class="pv-t">${[...f.effects.map(p => T(p, false)), ...f.drawbacks.map(p => T(p, false))].join("")}${f.varies ? `<span class="t lock">Varies by weapon</span>` : ""}</div>`; }
  if (k === "w" && wepById[id]){ const w = wepById[id], m = wmeta(w);
    return `<div class="pv-k">${esc(cl(w.class))} · ${m.rof ?? "—"} RPM · ${m.mag ?? "—"} rds</div><b>${esc(w.name)}</b><div class="pv-bars">${BAR_KEYS.map(b => `<span>${BARS[b].name.slice(0, 4)}<i><u style="width:${w.ingame?.[b] ?? 0}%"></u></i><em>${w.ingame?.[b] ?? "—"}</em></span>`).join("")}</div>`; }
  if (k === "tag" && TAGS[id]){ const t = TAGS[id], a = carriers(id);
    return `<div class="pv-k">${esc(DATA.groups.find(g => g.id === t.group).name)} · ${esc(id)}</div><b>${esc(t.name)}</b><div class="pv-s">${esc(t.desc)}</div><div class="pv-s">${a.up.length ? `▲ ${a.up.length} improve · ` : ""}${a.down.length ? `▼ ${a.down.length} worsen · ` : ""}${a.has.length ? `● ${a.has.length} carry` : ""}</div>`; }
  if (k === "bar" && BARS[id]){ const b = BARS[id];
    return `<div class="pv-k">In-game bar · ${esc(b.status)}</div><b>${esc(b.name)}</b><div class="pv-s">${esc(b.fit)}</div>`; }
  return null;
}
let pvT = null, pvFor = null;
document.addEventListener("mouseover", e => {
  if (!HOVER.matches) return;
  const a = e.target.closest('a[href^="#/a/"],a[href^="#/w/"],a[href^="#/tag/"],a[href^="#/bar/"]');
  if (!a || a.closest("#res") || a === pvFor) return;
  clearTimeout(pvT); pvFor = a;
  pvT = setTimeout(() => { const html = previewHTML(a.getAttribute("href")); if (!html) return;
    let pv = $("#pv"); if (!pv){ document.body.insertAdjacentHTML("beforeend", `<div id="pv" class="pv" role="tooltip"></div>`); pv = $("#pv"); }
    pv.innerHTML = html; pv.classList.add("show");
    const r = a.getBoundingClientRect(), W = pv.offsetWidth, H = pv.offsetHeight;
    let x = Math.min(innerWidth - W - 10, Math.max(10, r.left)), y = r.bottom + 8; if (y + H > innerHeight - 10) y = r.top - H - 8;
    pv.style.left = x + "px"; pv.style.top = y + "px"; }, 350);
});
document.addEventListener("mouseout", e => { const a = e.target.closest?.("a"); if (a && a === pvFor && !a.contains(e.relatedTarget)){ clearTimeout(pvT); pvFor = null; $("#pv")?.classList.remove("show"); } });
["scroll", "click"].forEach(ev => document.addEventListener(ev, () => { clearTimeout(pvT); pvFor = null; $("#pv")?.classList.remove("show"); }, true));

// view modes: 4K text, phone layout
const VIEW = {big: false, phone: false}; try { Object.assign(VIEW, JSON.parse(localStorage.getItem("view") || "{}")); } catch (e) {}
function buildPhoneCSS(){
  if ($("#phonecss")) return;
  const out = [];
  for (const sh of document.styleSheets){ let rules; try { rules = sh.cssRules; } catch (e) { continue; }
    for (const m of rules){ if (!(m instanceof CSSMediaRule) || !/max-width:\s*(760|1180)px/.test(m.conditionText || m.media.mediaText)) continue;
      for (const r of m.cssRules){ if (!(r instanceof CSSStyleRule)) continue;
        const sel = r.selectorText.split(",").map(x => { x = x.trim(); return /^body\b/.test(x) ? x.replace(/^body/, "body.phonemode") : /^:root/.test(x) ? "body.phonemode" : "body.phonemode " + x; }).join(",");
        out.push(`${sel}{${r.style.cssText}}`); } } }
  out.push("body.phonemode #phonebtn{display:inline-flex!important}");
  const st = document.createElement("style"); st.id = "phonecss"; st.textContent = out.join("\n"); document.head.appendChild(st);
}
function applyView(){
  if (VIEW.phone) buildPhoneCSS();
  document.body.classList.toggle("big", !!VIEW.big);
  document.body.classList.toggle("phonemode", !!VIEW.phone);
  $("#bigbtn").classList.toggle("on", !!VIEW.big); $("#phonebtn").classList.toggle("on", !!VIEW.phone);
  $("#bigbtn").setAttribute("aria-pressed", String(!!VIEW.big)); $("#phonebtn").setAttribute("aria-pressed", String(!!VIEW.phone));
  applyLayout();
}
$("#bigbtn").onclick = () => { VIEW.big = !VIEW.big; saveList("view", VIEW); applyView(); };
$("#phonebtn").onclick = () => { VIEW.phone = !VIEW.phone; saveList("view", VIEW); applyView(); render(); };
applyView();
addEventListener("popstate", sync); addEventListener("hashchange", sync); render(); applyLayout();
</script>
</body>
